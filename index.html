<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>capim | cards</title>
  <meta name="theme-color" content="#f4fdf6" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       RESET & SELEÇÃO AZUL
    ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: #3b82f6;
      color: #ffffff;
      -webkit-text-fill-color: #ffffff;
    }

    /* ============================================================
       VARIÁVEIS DE TEMA (LIGHT / DARK)
    ============================================================ */
    :root {
      /* Light Mode */
      --bg: #f4fdf6;
      --text: #111827;
      --text-dim: #6b7280;
      --border: rgba(0, 0, 0, 0.08);
      --glass: rgba(255, 255, 255, 0.65);
      --card-border: rgba(255, 255, 255, 0.8);
      --accent: #4ade80;
      --hotbar-bg: rgba(255, 255, 255, 0.8);
      --hotbar-border: rgba(255, 255, 255, 1);
      --hotbar-hover: rgba(0, 0, 0, 0.05);
      --modal-bg: #ffffff;
      --shadow-color: rgba(0, 0, 0, 0.05);
      --num-stroke: rgba(0, 0, 0, 0.04);
      --num-stroke-hover: rgba(74, 222, 128, 0.4);
      --watermark: rgba(0, 0, 0, 0.02);
      --grid-line: rgba(0, 0, 0, 0.03);
      --blob-opacity: 0.6;

      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --u: clamp(13px, 0.7vw + 10px, 18px);
      --radius: calc(var(--u) * 1.5);
      --radius-s: calc(var(--u) * 0.9);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Dark Mode */
    [data-theme="dark"] {
      --bg: #050505;
      --text: #f3f4f6;
      --text-dim: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --glass: rgba(20, 20, 20, 0.65);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #4ade80;
      --hotbar-bg: rgba(20, 20, 20, 0.8);
      --hotbar-border: rgba(255, 255, 255, 0.1);
      --hotbar-hover: rgba(255, 255, 255, 0.1);
      --modal-bg: #1f2937;
      --shadow-color: rgba(0, 0, 0, 0.5);
      --num-stroke: rgba(255, 255, 255, 0.06);
      --num-stroke-hover: rgba(74, 222, 128, 0.6);
      --watermark: rgba(255, 255, 255, 0.02);
      --grid-line: rgba(255, 255, 255, 0.04);
      --blob-opacity: 0.15;
    }

    /* Transições Globais */
    body, .card, .hotbar, .modal-content, .bg-blob, .bg-grid-lines, .bg-watermark, .card-file, .card-icon, .hotbar-btn, .pix-panel, .copy-btn, .close-panel {
      transition: background-color 0.6s ease, color 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
    }

    html, body { min-height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(20px, 4vw, 56px);
      position: relative;
    }

    /* ============================================================
       BACKGROUND
    ============================================================ */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .bg-blob {
      position: fixed;
      z-index: -3;
      filter: blur(60px);
      opacity: var(--blob-opacity);
      pointer-events: none;
      animation: floatBlob 20s infinite alternate ease-in-out;
    }

    .bg-blob-1 {
      top: -10vmax; left: -10vmax;
      width: 50vmax; height: 50vmax;
      background: radial-gradient(circle, #86efac 0%, transparent 70%);
      animation-delay: 0s;
    }
    .bg-blob-2 {
      bottom: -15vmax; right: -10vmax;
      width: 60vmax; height: 60vmax;
      background: radial-gradient(circle, #bbf7d0 0%, transparent 70%);
      animation-delay: -5s;
    }
    .bg-blob-3 {
      top: 40%; left: 30%;
      width: 40vmax; height: 40vmax;
      background: radial-gradient(circle, #dcfce7 0%, transparent 70%);
      animation-delay: -10s;
    }

    .bg-grid-lines {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 60px 60px;
      background-position: center center;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 80%);
    }

    .bg-watermark {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(4rem, 15vw, 12rem);
      font-weight: 900;
      color: var(--watermark);
      z-index: -1;
      pointer-events: none;
      user-select: none;
      letter-spacing: -0.05em;
      white-space: nowrap;
    }

    .bg-blocks {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      width: 100%;
      height: 100%;
      mix-blend-mode: multiply;
    }
    [data-theme="dark"] .bg-blocks { mix-blend-mode: screen; }

    /* ============================================================
       GRID DE CARDS
    ============================================================ */
    .grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: clamp(14px, 1.8vw, 24px);
      width: 100%;
      max-width: 1080px;
      perspective: 1400px;
      z-index: 1;
      margin-bottom: 120px;
    }

    .card {
      position: relative;
      display: block;
      padding: calc(var(--u) * 1.7);
      min-height: calc(var(--u) * 12);
      border-radius: var(--radius);
      background: var(--glass);
      border: 1px solid var(--card-border);
      color: inherit;
      text-decoration: none;
      overflow: hidden;
      isolation: isolate;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 6px -1px var(--shadow-color), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transform: perspective(1000px) rotateX(0) rotateY(0) scale(1);
      transition: transform 0.7s var(--ease-out), box-shadow 0.5s ease, opacity 0.35s ease, filter 0.35s ease;
      will-change: transform;
      animation: cardIn 0.9s var(--ease-out) backwards;
      cursor: pointer;
    }

    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.18s; }
    .card:nth-child(3) { animation-delay: 0.31s; }

    .card.clicked {
      opacity: 0;
      filter: blur(5px);
      transform: scale(0.95) !important;
      transition: all 0.3s ease-out;
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(74, 222, 128, 0.15), transparent 40%);
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
      z-index: 0;
    }
    .card:hover::after { opacity: 1; }

    .card:hover {
      box-shadow: 0 20px 40px -10px var(--shadow-color), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .grid:hover .card:not(:hover):not(.clicked) {
      opacity: 0.5;
      filter: saturate(0.5) blur(0.5px);
    }

    .card-shine {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.4) 50%, transparent 70%);
      transform: translateX(-120%);
      transition: transform 1s var(--ease-out);
      pointer-events: none;
      z-index: 3;
    }
    .card:hover .card-shine { transform: translateX(120%); }

    .card-num {
      position: absolute;
      bottom: calc(var(--u) * -1.4);
      right: calc(var(--u) * 0.8);
      font-size: calc(var(--u) * 7);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.08em;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--num-stroke);
      transition: all 0.6s ease;
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }
    .card:hover .card-num {
      -webkit-text-stroke-color: var(--num-stroke-hover);
      transform: translateY(-2px);
    }

    .card-body {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: calc(var(--u) * 9);
      transform: translateZ(28px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: calc(var(--u) * 1.2);
    }

    .card-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: calc(var(--u) * 3.1);
      height: calc(var(--u) * 3.1);
      border-radius: var(--radius-s);
      background: var(--text);
      color: var(--bg);
      box-shadow: 0 4px 12px var(--shadow-color);
      transition: transform 0.55s var(--ease-out), background-color 0.3s, color 0.3s;
    }
    .card-icon svg {
      width: calc(var(--u) * 1.6);
      height: calc(var(--u) * 1.6);
      fill: currentColor;
      transform: translateX(2px);
    }
    .card:hover .card-icon {
      transform: translateZ(24px) scale(1.08) rotate(-4deg);
      background: var(--accent);
      color: #111827;
    }

    .card-dot {
      display: inline-block;
      width: calc(var(--u) * 0.45);
      height: calc(var(--u) * 0.45);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      margin-top: calc(var(--u) * 0.35);
    }

    .card-info { margin-bottom: calc(var(--u) * 1.1); }

    .card-title {
      font-size: calc(var(--u) * 1.25);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--text);
      margin-bottom: calc(var(--u) * 0.3);
    }

    .card-desc {
      font-size: calc(var(--u) * 0.82);
      color: var(--text-dim);
      line-height: 1.5;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(var(--u) * 0.8);
      margin-top: auto;
    }

    .card-file {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--u) * 0.4);
      font-size: calc(var(--u) * 0.72);
      font-family: var(--font-mono);
      color: var(--text-dim);
      padding: calc(var(--u) * 0.28) calc(var(--u) * 0.6);
      border-radius: calc(var(--u) * 0.5);
      background: var(--hotbar-hover);
      border: 1px solid var(--border);
    }

    .pill-dot {
      width: calc(var(--u) * 0.35);
      height: calc(var(--u) * 0.35);
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* ============================================================
       HOTBAR
    ============================================================ */
    .hotbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px;
      background: var(--hotbar-bg);
      border: 1px solid var(--hotbar-border);
      border-radius: 999px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px -10px var(--shadow-color);
      z-index: 1000;
      animation: hotbarIn 1s var(--ease-out) 0.5s both;
    }

    .hotbar-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s var(--ease-out);
    }

    .hotbar-btn:hover {
      background: var(--hotbar-hover);
      transform: scale(1.02);
    }

    .hotbar-btn.primary {
      background: var(--text);
      color: var(--bg);
    }
    .hotbar-btn.primary:hover {
      background: var(--accent);
      color: #111827;
      box-shadow: 0 4px 12px rgba(74, 222, 128, 0.3);
    }

    .hotbar-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ============================================================
       PAINEL DO PIX E ANIMAÇÃO
    ============================================================ */
    .pix-fly-ball {
      position: fixed;
      background: var(--text);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      z-index: 9999;
      pointer-events: none;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      will-change: transform, width, height, border-radius;
    }

    .pix-fly-ball svg { width: 18px; height: 18px; flex-shrink: 0; }

    .pix-burst {
      position: fixed;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74, 222, 128, 0.6) 0%, rgba(74, 222, 128, 0) 70%);
      border: 2px solid var(--accent);
      bottom: 20px;
      right: 20px;
      transform: scale(0);
      opacity: 1;
      z-index: 9998;
      pointer-events: none;
      animation: burstCorner 0.6s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    @keyframes burstCorner {
      0% { transform: scale(0); opacity: 1; }
      50% { transform: scale(2.5); opacity: 0.8; }
      100% { transform: scale(4); opacity: 0; }
    }

    .pix-panel {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 300px;
      background: var(--modal-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px -10px var(--shadow-color);
      z-index: 10000;
      opacity: 0;
      transform: translateY(30px) scale(0.9);
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .pix-panel.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .pix-panel h3 { font-size: 1.1rem; margin-bottom: 4px; text-align: center; color: var(--text); }
    .pix-panel p { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 20px; text-align: center; line-height: 1.4; }

    /* QR Code com Fundo Preto e Imagem Quadrada */
    .qr-container {
      width: 100%;
      aspect-ratio: 1;
      background: #000000;
      border-radius: 16px; /* Borda do fundo arredondada */
      padding: 12px;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 0; /* Imagem quadrada */
      image-rendering: pixelated; /* Mantém o QR nítido */
    }

    .copy-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s var(--spring);
    }

    .copy-btn:hover { background: var(--accent); color: #111827; transform: scale(1.02); }
    .copy-btn.copied { background: var(--accent); color: #111827; }
    .copy-btn svg { width: 18px; height: 18px; }

    .close-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--hotbar-hover);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      transition: background 0.2s;
    }
    .close-panel:hover { background: var(--border); color: var(--text); }

    /* ============================================================
       TRANSIÇÃO DE PÁGINA (TELA BRANCA)
    ============================================================ */
    #page-transition {
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 99999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    }
    #page-transition.active {
      opacity: 1;
      pointer-events: all;
    }

    .bubble-burst {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(74, 222, 128, 0.4) 40%, transparent 70%);
      border: 2px solid var(--accent);
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 9998;
      animation: burst 0.6s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    /* ============================================================
       KEYFRAMES
    ============================================================ */
    @keyframes cardIn {
      from { opacity: 0; transform: perspective(1000px) translateY(24px) scale(0.95); filter: blur(10px); }
      to { opacity: 1; transform: perspective(1000px) translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes hotbarIn {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(5%, 5%) scale(1.1); }
      100% { transform: translate(-5%, -5%) scale(1); }
    }

    @keyframes burst {
      0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
    }

    /* ============================================================
       RESPONSIVO
    ============================================================ */
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .hotbar { width: calc(100% - 32px); justify-content: space-between; }
      .hotbar-btn { padding: 10px 14px; font-size: 0.85rem; }
      .hotbar-btn span { display: none; }
      .hotbar-btn.primary span { display: block; }
      .pix-panel { width: calc(100% - 32px); bottom: 16px; right: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div id="page-transition"></div>

  <!-- BACKGROUND -->
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
  <div class="bg-grid-lines"></div>
  <div class="bg-watermark">geometry</div>
  <canvas class="bg-blocks" id="blocks"></canvas>

  <!-- CARDS -->
  <main class="grid">
    <a class="card" href="1.html">
      <span class="card-num">01</span>
      <span class="card-shine"></span>
      <div class="card-body">
        <div class="card-top">
          <div class="card-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"/></svg>
          </div>
          <span class="card-dot"></span>
        </div>
        <div class="card-info">
          <h2 class="card-title">Jogo 1</h2>
          <p class="card-desc">Primeiro projeto do repositório</p>
        </div>
        <div class="card-bottom">
          <span class="card-file"><span class="pill-dot"></span>1.html</span>
        </div>
      </div>
    </a>

    <a class="card" href="2.hmtl">
      <span class="card-num">02</span>
      <span class="card-shine"></span>
      <div class="card-body">
        <div class="card-top">
          <div class="card-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"/></svg>
          </div>
          <span class="card-dot"></span>
        </div>
        <div class="card-info">
          <h2 class="card-title">Jogo 2</h2>
          <p class="card-desc">Segundo projeto do repositório</p>
        </div>
        <div class="card-bottom">
          <span class="card-file"><span class="pill-dot"></span>2.hmtl</span>
        </div>
      </div>
    </a>

    <a class="card" href="3.html">
      <span class="card-num">03</span>
      <span class="card-shine"></span>
      <div class="card-body">
        <div class="card-top">
          <div class="card-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"/></svg>
          </div>
          <span class="card-dot"></span>
        </div>
        <div class="card-info">
          <h2 class="card-title">Jogo 3</h2>
          <p class="card-desc">Terceiro projeto do repositório</p>

    </a>
  </main>

  <!-- HOTBAR -->
  <nav class="hotbar" id="mainHotbar">
    <button class="hotbar-btn" id="themeToggle" title="Alternar Tema">
      <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>

    <a href="https://capimm.vercel.app/" target="_blank" class="hotbar-btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      <span>Meu Site</span>
    </a>

    <button class="hotbar-btn" id="pixBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span>Apoiar via Pix</span>
    </button>
  </nav>

  <!-- PAINEL DO PIX -->
  <div class="pix-panel" id="pixPanel">
    <button class="close-panel" id="closePix">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <h3>Apoie o projeto! 💚</h3>
    <p>Escaneie o QR Code ou copie o link do Nubank.</p>
    
    <div class="qr-container">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://nubank.com.br/cobrar/7c4vss/6ab88395-e755-4bbb-9c16-ff01f8317d6e" alt="QR Code Pix">
    </div>
    
    <button class="copy-btn" id="copyPixBtn">
      <svg id="copyIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      <span id="copyText">Copiar link do Nubank</span>
    </button>
  </div>

  <script>
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* 1. BLOQUEIA BOTÃO DIREITO */
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    /* 2. TEMA CLARO / ESCURO */
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const iconSun = document.getElementById('icon-sun');
    const iconMoon = document.getElementById('icon-moon');

    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      html.setAttribute('data-theme', 'dark');
      iconSun.style.display = 'block';
      iconMoon.style.display = 'none';
    }

    themeToggle.addEventListener('click', () => {
      if (html.getAttribute('data-theme') === 'light') {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        iconSun.style.display = 'block';
        iconMoon.style.display = 'none';
      } else {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        iconSun.style.display = 'none';
        iconMoon.style.display = 'block';
      }
    });

    /* 3. EFEITO DO PIX (BOLA VOANDO) */
    const pixBtn = document.getElementById('pixBtn');
    const pixPanel = document.getElementById('pixPanel');
    const closePix = document.getElementById('closePix');
    const copyPixBtn = document.getElementById('copyPixBtn');
    const copyText = document.getElementById('copyText');
    const copyIcon = document.getElementById('copyIcon');

    const nubankLink = "https://nubank.com.br/cobrar/7c4vss/6ab88395-e755-4bbb-9c16-ff01f8317d6e";

    pixBtn.addEventListener('click', (e) => {
      e.preventDefault();
      
      const rect = pixBtn.getBoundingClientRect();
      const startX = rect.left;
      const startY = rect.top;
      const startWidth = rect.width;
      const startHeight = rect.height;
      
      pixBtn.style.opacity = '0';
      pixBtn.style.pointerEvents = 'none';

      const ball = document.createElement('div');
      ball.className = 'pix-fly-ball';
      ball.style.left = `${startX}px`;
      ball.style.top = `${startY}px`;
      ball.style.width = `${startWidth}px`;
      ball.style.height = `${startHeight}px`;
      ball.innerHTML = pixBtn.querySelector('svg').outerHTML;
      document.body.appendChild(ball);

      const targetX = window.innerWidth - 24 - 25; 
      const targetY = window.innerHeight - 24 - 25;

      // FASE 1: Antecipação (bem sutil)
      const anticipateAnim = ball.animate([
        { transform: 'scale(1)' },
        { transform: 'scale(0.95)' }
      ], {
        duration: 150,
        easing: 'ease-in',
        fill: 'forwards'
      });

      anticipateAnim.onfinish = () => {
        // FASE 2: Encolhimento
        const shrinkAnim = ball.animate([
          { width: `${startWidth}px`, height: `${startHeight}px`, borderRadius: '999px', transform: 'scale(0.95)' },
          { width: `${startHeight}px`, height: `${startHeight}px`, borderRadius: '50%', transform: 'scale(1.02)' }
        ], {
          duration: 400,
          easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)',
          fill: 'forwards'
        });

        shrinkAnim.onfinish = () => {
          ball.style.width = `${startHeight}px`;
          ball.style.height = `${startHeight}px`;
          ball.style.borderRadius = '50%';

          const deltaX = targetX - startX;
          const deltaY = targetY - startY;
          const arcHeight = window.innerHeight * 0.35; // Arco mais alto

          // FASE 3: Voo Super Fluido
          const flyAnim = ball.animate([
            { transform: `translate(0, 0) scale(1)` },
            { transform: `translate(${deltaX * 0.2}px, ${-arcHeight * 0.6}px) scale(1.1)`, offset: 0.25 },
            { transform: `translate(${deltaX * 0.5}px, ${-arcHeight}px) scale(1.05)`, offset: 0.5 },
            { transform: `translate(${deltaX * 0.85}px, ${deltaY * 0.8}px) scale(0.95)`, offset: 0.8 },
            { transform: `translate(${deltaX}px, ${deltaY}px) scale(1)` }
          ], {
            duration: 1400, // Bem mais suave
            easing: 'cubic-bezier(0.25, 1, 0.5, 1)', // Aceleração natural
            fill: 'forwards'
          });

          flyAnim.onfinish = () => {
            ball.remove();
            
            const burst = document.createElement('div');
            burst.className = 'pix-burst';
            document.body.appendChild(burst);

            setTimeout(() => {
              burst.remove();
              pixPanel.classList.add('active');
            }, 250); 
          };
        };
      };
    });

    // Fechar painel
    closePix.addEventListener('click', () => {
      pixPanel.classList.remove('active');
      setTimeout(() => {
        pixBtn.style.opacity = '1';
        pixBtn.style.pointerEvents = 'auto';
      }, 400);
    });

    // Copiar Link
    copyPixBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(nubankLink);
        copyText.innerText = "Copiado com sucesso!";
        copyPixBtn.classList.add('copied');
        copyIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';

        setTimeout(() => {
          copyText.innerText = "Copiar link do Nubank";
          copyPixBtn.classList.remove('copied');
          copyIcon.innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>';
        }, 2500);
      } catch (err) {
        alert("Erro ao copiar.");
      }
    });

    /* 4. EFEITO DE ESTOURO DE BOLHA + TRANSIÇÃO BRANCA (Cards) */
    const transitionScreen = document.getElementById('page-transition');

    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', function(e) {
        e.preventDefault(); 
        const href = this.getAttribute('href');

        const rect = this.getBoundingClientRect();
        const x = e.clientX || (rect.left + rect.width / 2);
        const y = e.clientY || (rect.top + rect.height / 2);

        const bubble = document.createElement('div');
        bubble.className = 'bubble-burst';
        bubble.style.left = x + 'px';
        bubble.style.top = y + 'px';
        bubble.style.width = '100px';
        bubble.style.height = '100px';
        document.body.appendChild(bubble);

        this.classList.add('clicked');

        setTimeout(() => {
          transitionScreen.classList.add('active');
        }, 200);

        setTimeout(() => {
          window.location.href = href;
        }, 700);
      });
    });

    /* 5. BACKGROUND DE BLOCOS DE GELEIA */
    (function jellyBlocks() {
      const canvas = document.getElementById('blocks');
      const ctx = canvas.getContext('2d');
      const DPR = Math.min(window.devicePixelRatio || 1, 2);
      
      let W = 0, H = 0;
      let cols = 0, rows = 0;
      const cellSize = 32;
      const gap = 4;
      let blocks = [];

      let tx = -9999, ty = -9999;
      let mx = -9999, my = -9999;

      function init() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        cols = Math.ceil(W / (cellSize + gap)) + 1;
        rows = Math.ceil(H / (cellSize + gap)) + 1;

        blocks = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            blocks.push({
              x: c * (cellSize + gap),
              y: r * (cellSize + gap),
              scale: 1,
              targetScale: 1,
              vx: 0
            });
          }
        }
      }

      document.addEventListener('mousemove', (e) => {
        tx = e.clientX;
        ty = e.clientY;
      }, { passive: true });
      document.addEventListener('mouseleave', () => { tx = -9999; ty = -9999; });

      function render() {
        if (mx === -9999) { mx = tx; my = ty; }
        else {
          mx += (tx - mx) * 0.2;
          my += (ty - my) * 0.2;
        }

        ctx.clearRect(0, 0, W, H);
        const radius = 180;
        
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const baseColor = isDark ? '255, 255, 255' : '74, 222, 128'; 

        for (const b of blocks) {
          const cx = b.x + cellSize / 2;
          const cy = b.y + cellSize / 2;
          const dx = cx - mx;
          const dy = cy - my;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < radius) {
            const force = 1 - dist / radius;
            b.targetScale = 1 + force * 1.5; 
          } else {
            b.targetScale = 1;
          }

          const stiffness = 0.15;
          const damping = 0.75;
          
          b.vx += (b.targetScale - b.scale) * stiffness;
          b.vx *= damping;
          b.scale += b.vx;

          const actualSize = cellSize * b.scale;
          const offset = (actualSize - cellSize) / 2;
          const drawX = b.x - offset;
          const drawY = b.y - offset;

          const alpha = 0.05 + (b.scale - 1) * 0.1; 
          
          ctx.fillStyle = `rgba(${baseColor}, ${alpha})`;
          ctx.beginPath();
          ctx.roundRect(drawX, drawY, actualSize, actualSize, 6 * b.scale);
          ctx.fill();
        }

        requestAnimationFrame(render);
      }

      init();
      window.addEventListener('resize', init);
      if (!reduceMotion) render();
    })();
  </script>
</body>
