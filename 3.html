<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>eo jogo</title>
<style>
  :root{
    --ink:#0b0b0c;
    --paper:#ffffff;
    --ease:cubic-bezier(.76,0,.24,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .scene{
    position:fixed; inset:0;
    overflow:hidden;
    cursor:pointer;
  }

  /* ================= CENA FINAL ================= */
  .final{
    position:absolute; inset:0;
    background:#08080a;
    display:grid; place-items:center;
    z-index:1;
    overflow:hidden;
    pointer-events:none;
  }

  .glow{
    position:absolute;
    left:50%; top:50%;
    width:130vmax; height:130vmax;
    margin:-65vmax 0 0 -65vmax;
    background:radial-gradient(circle,
      rgba(255,186,102,.18) 0%,
      rgba(255,120,70,.07) 30%,
      rgba(255,120,70,0) 62%);
    opacity:0;
    pointer-events:none;
    will-change:transform,opacity;
  }

  .final-inner{
    position:relative; z-index:1;
    display:grid; justify-items:center;
    gap:2.4rem;
    will-change:transform;
  }

  .title{
    display:flex;
    font-size:clamp(3rem,15vw,10rem);
    font-weight:800;
    line-height:.92;
    letter-spacing:-.05em;
    color:#f6f3ee;
    white-space:nowrap;
    user-select:none;
  }
  .title .l{
    display:inline-block;
    opacity:0;
    will-change:transform,opacity,filter;
  }

  .hint{
    font-size:.68rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:rgba(246,243,238,.32);
    opacity:0;
    pointer-events:none;
  }

  /* ================= PORTAS ================= */
  .doors{
    position:absolute; inset:0;
    z-index:5;
    perspective: 1600px;
    perspective-origin: 50% 50%;
    pointer-events:none;
  }

  .half{
    position:absolute;
    left:0; right:0;
    height:50%;
    background:var(--paper);
    backface-visibility:hidden;
    will-change:transform;
    transform: rotateX(0deg);
    box-shadow: 0 0 0 1px #fff; /* mata costura */
  }

  .half-top{
    top:0;
    transform-origin: center bottom;
  }
  .half-bottom{
    bottom:0;
    transform-origin: center top;
  }

  /* brilho quente no centro conforme as portas abrem */
  .seam-glow{
    position:absolute;
    left:50%; top:50%;
    width:2px; height:80vh;
    margin:-40vh 0 0 -1px;
    background:linear-gradient(180deg,
      rgba(255,200,140,0) 0%,
      rgba(255,200,140,.9) 50%,
      rgba(255,200,140,0) 100%);
    filter: blur(1px);
    opacity:0;
    pointer-events:none;
    z-index:6;
    will-change:opacity, transform;
  }

  /* ================= INTRO ================= */
  .cue-wrap{
    position:absolute; inset:0;
    display:grid; place-items:center;
    z-index:8;
    pointer-events:none;
  }

  .cue{
    display:inline-flex;
    align-items:center;
    gap:.65rem;
    padding:1.1rem 1.5rem;
    border:0;
    background:none;
    font:inherit;
    font-size:.7rem;
    font-weight:500;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:#a6a6ad;
    cursor:pointer;
    pointer-events:auto;
    transition:color .45s ease, letter-spacing .45s ease;
  }
  .cue:hover{ color:var(--ink); letter-spacing:.38em }
  .cue:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:8px;
    border-radius:999px;
  }

  .cue-dot{
    position:relative;
    width:5px; height:5px;
    border-radius:50%;
    background:currentColor;
    flex:none;
  }
  .cue-dot::after{
    content:"";
    position:absolute; inset:-5px;
    border-radius:50%;
    border:1px solid currentColor;
    animation:ping 2.6s ease-out infinite;
  }
  @keyframes ping{
    0%       { transform:scale(.5); opacity:.55 }
    70%,100% { transform:scale(2.1); opacity:0 }
  }

  .sr{
    position:absolute;
    width:1px; height:1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
  }

  @media (prefers-reduced-motion: reduce){
    .cue-dot::after{ animation:none }
  }
</style>
</head>
<body>

<main class="scene" id="scene">

  <div class="final" id="final">
    <div class="glow" id="glow" aria-hidden="true"></div>
    <div class="final-inner" id="finalInner">
      <h1 class="title" id="title" aria-hidden="true"></h1>
      <p class="hint" id="hint">clique para repetir</p>
    </div>
  </div>

  <div class="doors" id="doors" aria-hidden="true">
    <div class="half half-top"    id="halfTop"></div>
    <div class="half half-bottom" id="halfBottom"></div>
  </div>

  <div class="seam-glow" id="seamGlow" aria-hidden="true"></div>

  <div class="cue-wrap" id="cueWrap">
    <button class="cue" id="cue" type="button">
      <span class="cue-dot" aria-hidden="true"></span>
      <span>clique</span>
    </button>
  </div>

</main>

<p class="sr" id="live" aria-live="polite"></p>

<script>
(() => {
  const scene      = document.getElementById('scene');
  const finalEl    = document.getElementById('final');
  const finalInner = document.getElementById('finalInner');
  const title      = document.getElementById('title');
  const hint       = document.getElementById('hint');
  const glow       = document.getElementById('glow');
  const halfTop    = document.getElementById('halfTop');
  const halfBottom = document.getElementById('halfBottom');
  const seamGlow   = document.getElementById('seamGlow');
  const cueWrap    = document.getElementById('cueWrap');
  const live       = document.getElementById('live');

  const WORD   = 'eo jogo';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // letras
  [...WORD].forEach(ch => {
    const s = document.createElement('span');
    s.className = 'l';
    s.textContent = ch === ' ' ? '\u00A0' : ch;
    title.appendChild(s);
  });
  const letters = [...title.children];

  const wait = ms => new Promise(r => setTimeout(r, ms));
  const anim = (el, frames, opts) => {
    const a = el.animate(frames, opts);
    a.finished.catch(() => {});
    return a.finished;
  };
  const clearAnims = el => el.getAnimations().forEach(a => a.cancel());

  let state = 'idle';

  /* ---------- abrir as portas ---------- */
  async function play() {
    if (state !== 'idle') return;
    state = 'busy';

    const DOOR_DUR = reduce ? 400 : 1200;
    const ease = 'cubic-bezier(.76,0,.24,1)';

    // 1 — o convite some
    anim(cueWrap, [
      { opacity: 1, transform: 'scale(1)' },
      { opacity: 0, transform: 'scale(.92)' }
    ], { duration: reduce ? 180 : 340, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });

    await wait(reduce ? 100 : 200);

    // 2 — brilho no meio nasce antes das portas
    anim(seamGlow, [
      { opacity: 0, transform: 'scaleY(.2)' },
      { opacity: 1, transform: 'scaleY(1)' },
      { opacity: 0, transform: 'scaleY(1.4)' }
    ], {
      duration: reduce ? 300 : 1400,
      easing: 'cubic-bezier(.22,1,.36,1)',
      fill: 'forwards'
    });

    // 3 — cena final "respira" por trás (parallax)
    anim(finalInner, [
      { transform: 'scale(1.16)' },
      { transform: 'scale(1)' }
    ], {
      duration: reduce ? 400 : 1700,
      easing: 'cubic-bezier(.22,1,.36,1)',
      fill: 'both'
    });

    // 4 — as duas metades giram para dentro do cenário (perspectiva)
    anim(halfTop, [
      { transform: 'rotateX(0deg)' },
      { transform: 'rotateX(91deg)' }
    ], { duration: DOOR_DUR, easing: ease, fill: 'forwards' });

    anim(halfBottom, [
      { transform: 'rotateX(0deg)' },
      { transform: 'rotateX(-91deg)' }
    ], { duration: DOOR_DUR, easing: ease, fill: 'forwards' });

    // 5 — glow nasce conforme as portas abrem
    anim(glow, [
      { opacity: 0, transform: 'translate(-50%,-50%) scale(.5)' },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1)' }
    ], {
      duration: reduce ? 300 : 1400,
      delay: reduce ? 0 : 220,
      easing: 'cubic-bezier(.22,1,.36,1)',
      fill: 'forwards'
    });

    // 6 — letras saltam em stagger
    await wait(reduce ? 200 : 380);
    letters.forEach((l, i) => {
      anim(l, [
        { opacity: 0, transform: 'translateY(.55em) scale(.84)', filter: 'blur(14px)' },
        { opacity: 1, transform: 'translateY(0) scale(1)',       filter: 'blur(0px)' }
      ], {
        duration: reduce ? 260 : 800,
        delay: i * (reduce ? 0 : 55),
        easing: 'cubic-bezier(.34,1.56,.64,1)',
        fill: 'forwards'
      });
    });

    await wait(letters.length * (reduce ? 0 : 55) + 620);

    // 7 — dica
    anim(hint, [
      { opacity: 0, transform: 'translateY(6px)' },
      { opacity: 1, transform: 'translateY(0)'   }
    ], { duration: 700, easing: 'ease', fill: 'forwards' });

    live.textContent = 'eo jogo';
    state = 'done';
  }

  /* ---------- fechar as portas (reset) ---------- */
  async function reset() {
    state = 'busy';

    // 1 — letras e dica saem
    anim(hint, [{ opacity: 1 }, { opacity: 0 }],
      { duration: 260, easing: 'ease', fill: 'forwards' });

    letters.forEach((l, i) => {
      anim(l, [
        { opacity: 1, transform: 'translateY(0) scale(1)',       filter: 'blur(0px)' },
        { opacity: 0, transform: 'translateY(.3em) scale(.9)',    filter: 'blur(10px)' }
      ], {
        duration: 320,
        delay: i * 25,
        easing: 'cubic-bezier(.4,0,.2,1)',
        fill: 'forwards'
      });
    });

    await wait(340);

    // 2 — portas voltam a fechar
    const ease = 'cubic-bezier(.76,0,.24,1)';
    anim(halfTop, [
      { transform: 'rotateX(91deg)' },
      { transform: 'rotateX(0deg)' }
    ], { duration: 900, easing: ease, fill: 'forwards' });

    anim(halfBottom, [
      { transform: 'rotateX(-91deg)' },
      { transform: 'rotateX(0deg)' }
    ], { duration: 900, easing: ease, fill: 'forwards' });

    await wait(880);

    // 3 — agora escondido atrás das portas: limpa tudo
    clearAnims(finalEl);
    clearAnims(finalInner);
    clearAnims(glow);
    clearAnims(seamGlow);
    clearAnims(hint);
    letters.forEach(clearAnims);
    clearAnims(halfTop);
    clearAnims(halfBottom);

    finalInner.style.transform = '';
    glow.style.opacity = '0';
    seamGlow.style.opacity = '0';
    hint.style.opacity = '0';
    letters.forEach(l => { l.style.opacity = '0'; });
    halfTop.style.transform = 'rotateX(0deg)';
    halfBottom.style.transform = 'rotateX(0deg)';

    // 4 — o convite volta
    clearAnims(cueWrap);
    cueWrap.style.opacity = '0';
    anim(cueWrap, [
      { opacity: 0, transform: 'scale(1.1)' },
      { opacity: 1, transform: 'scale(1)' }
    ], { duration: 500, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });

    live.textContent = '';
    await wait(160);
    state = 'idle';
  }

  /* ---------- cliques ---------- */
  scene.addEventListener('click', () => {
    if (state === 'idle')      play();
    else if (state === 'done') reset();
  });

  scene.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state === 'done') reset();
  });
})();
</script>
</body>
</html>
