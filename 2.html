<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>eo jogo</title>
<style>
  :root{
    --ink:#0b0b0c;
    --paper:#ffffff;
    --ease:cubic-bezier(.76,0,.24,1);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .scene{
    position:fixed; inset:0;
    overflow:hidden;
    cursor:pointer;
  }

  /* =============== CENA FINAL =============== */
  .final{
    position:absolute; inset:0;
    background:#08080a;
    display:grid; place-items:center;
    opacity:0;
    clip-path: circle(0px at 50% 50%);
    z-index:1;
    will-change: clip-path, opacity;
    overflow:hidden;
  }

  .glow{
    position:absolute;
    left:50%; top:50%;
    width:130vmax; height:130vmax;
    margin:-65vmax 0 0 -65vmax;
    background:radial-gradient(circle,
      rgba(255,186,102,.17) 0%,
      rgba(255,120,70,.07) 30%,
      rgba(255,120,70,0) 62%);
    opacity:0;
    pointer-events:none;
    will-change:transform,opacity;
  }

  .final-inner{
    position:relative; z-index:1;
    display:grid; justify-items:center;
    gap:2.4rem;
    will-change:transform;
  }

  .title{
    display:flex;
    font-size:clamp(3rem,15vw,10rem);
    font-weight:800;
    line-height:.92;
    letter-spacing:-.05em;
    color:#f6f3ee;
    white-space:nowrap;
    user-select:none;
  }
  .title .l{
    display:inline-block;
    opacity:0;
    will-change:transform,opacity,filter;
  }

  .hint{
    font-size:.68rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:rgba(246,243,238,.32);
    opacity:0;
    pointer-events:none;
  }

  /* =============== INTRO =============== */
  .intro{
    position:absolute; inset:0;
    display:grid; place-items:center;
    z-index:5;
    will-change:transform,opacity;
  }

  .cue{
    display:inline-flex;
    align-items:center;
    gap:.65rem;
    padding:1.1rem 1.5rem;
    border:0;
    background:none;
    font:inherit;
    font-size:.7rem;
    font-weight:500;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:#a6a6ad;
    cursor:pointer;
    transition:color .45s ease, letter-spacing .45s ease;
  }
  .cue:hover{ color:var(--ink); letter-spacing:.38em }
  .cue:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:8px;
    border-radius:999px;
  }

  .cue-dot{
    position:relative;
    width:5px; height:5px;
    border-radius:50%;
    background:currentColor;
    flex:none;
  }
  .cue-dot::after{
    content:"";
    position:absolute; inset:-5px;
    border-radius:50%;
    border:1px solid currentColor;
    animation:ping 2.6s ease-out infinite;
  }
  @keyframes ping{
    0%       { transform:scale(.5); opacity:.55 }
    70%,100% { transform:scale(2.1); opacity:0 }
  }

  /* =============== SHOCKWAVE RING =============== */
  .ring{
    position:fixed;
    width:40px; height:40px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,.7);
    pointer-events:none;
    z-index:20;
    will-change:transform,opacity;
    mix-blend-mode:difference;
  }

  .sr{
    position:absolute;
    width:1px; height:1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
  }

  @media (prefers-reduced-motion: reduce){
    .cue-dot::after{ animation:none }
  }
</style>
</head>
<body>

<main class="scene" id="scene">

  <div class="final" id="final">
    <div class="glow" id="glow" aria-hidden="true"></div>
    <div class="final-inner" id="finalInner">
      <h1 class="title" id="title" aria-hidden="true"></h1>
      <p class="hint" id="hint">clique para repetir</p>
    </div>
  </div>

  <div class="intro" id="intro">
    <button class="cue" id="cue" type="button">
      <span class="cue-dot" aria-hidden="true"></span>
      <span>clique</span>
    </button>
  </div>

</main>

<p class="sr" id="live" aria-live="polite"></p>

<script>
(() => {
  const scene      = document.getElementById('scene');
  const finalEl    = document.getElementById('final');
  const finalInner = document.getElementById('finalInner');
  const title      = document.getElementById('title');
  const hint       = document.getElementById('hint');
  const glow       = document.getElementById('glow');
  const intro      = document.getElementById('intro');
  const live       = document.getElementById('live');

  const WORD   = 'eo jogo';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // monta as letras
  [...WORD].forEach(ch => {
    const s = document.createElement('span');
    s.className = 'l';
    s.textContent = ch === ' ' ? '\u00A0' : ch;
    title.appendChild(s);
  });
  const letters = [...title.children];

  const wait = ms => new Promise(r => setTimeout(r, ms));
  const anim = (el, frames, opts) => {
    const a = el.animate(frames, opts);
    a.finished.catch(() => {});
    return a.finished;
  };
  const clearAnims = el => el.getAnimations().forEach(a => a.cancel());

  let state = 'idle';

  /* ---------- anel de choque ---------- */
  function ring(x, y) {
    const el = document.createElement('span');
    el.className = 'ring';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.style.transform = 'translate(-50%, -50%)';
    document.body.appendChild(el);
    el.animate([
      { transform: 'translate(-50%,-50%) scale(.4)', opacity: .8 },
      { transform: 'translate(-50%,-50%) scale(4)',  opacity: 0  }
    ], { duration: 950, easing: 'cubic-bezier(.22,1,.36,1)' })
      .finished.then(() => el.remove());
  }

  /* ---------- sequência ---------- */
  async function play(x, y) {
    if (state !== 'idle') return;
    state = 'busy';

    const w = scene.clientWidth  || innerWidth;
    const h = scene.clientHeight || innerHeight;
    const R = Math.hypot(w, h) * 1.15;

    if (!reduce) ring(x, y);

    // origem do zoom do intro = ponto do clique
    intro.style.transformOrigin = `${(x / w) * 100}% ${(y / h) * 100}%`;

    // 1 — intro voa pro ponto do clique e some
    anim(intro, [
      { opacity: 1, transform: 'scale(1)' },
      { opacity: 0, transform: 'scale(2.6)' }
    ], {
      duration: reduce ? 200 : 760,
      easing: 'cubic-bezier(.55,0,.25,1)',
      fill: 'forwards'
    });

    // 2 — máscara circular abre a partir do clique
    finalEl.style.opacity = '1';
    anim(finalEl, [
      { clipPath: `circle(0px at ${x}px ${y}px)` },
      { clipPath: `circle(${R}px at ${x}px ${y}px)` }
    ], {
      duration: reduce ? 300 : 1150,
      easing: 'cubic-bezier(.76,0,.24,1)',
      fill: 'forwards'
    });

    // 3 — cena final vem de trás (parallax), em sincronia
    anim(finalInner, [
      { transform: 'scale(1.28)' },
      { transform: 'scale(1)' }
    ], {
      duration: reduce ? 300 : 1400,
      easing: 'cubic-bezier(.22,1,.36,1)',
      fill: 'both'
    });

    // 4 — glow nasce
    anim(glow, [
      { opacity: 0, transform: 'translate(-50%,-50%) scale(.5)' },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1)'  }
    ], {
      duration: reduce ? 300 : 1300,
      delay: reduce ? 0 : 320,
      easing: 'cubic-bezier(.22,1,.36,1)',
      fill: 'forwards'
    });

    // 5 — letras saltam em stagger
    await wait(reduce ? 200 : 420);
    letters.forEach((l, i) => {
      anim(l, [
        { opacity: 0, transform: 'translateY(.55em) scale(.85)', filter: 'blur(14px)' },
        { opacity: 1, transform: 'translateY(0) scale(1)',       filter: 'blur(0px)' }
      ], {
        duration: reduce ? 260 : 780,
        delay: i * (reduce ? 0 : 55),
        easing: 'cubic-bezier(.34,1.56,.64,1)',
        fill: 'forwards'
      });
    });

    await wait(letters.length * (reduce ? 0 : 55) + 620);

    // 6 — dica
    anim(hint, [
      { opacity: 0, transform: 'translateY(6px)' },
      { opacity: 1, transform: 'translateY(0)'   }
    ], { duration: 700, easing: 'ease', fill: 'forwards' });

    live.textContent = 'eo jogo';
    state = 'done';
  }

  /* ---------- reset ---------- */
  async function reset() {
    state = 'busy';

    anim(finalInner, [
      { transform: 'scale(1)' },
      { transform: 'scale(.94)' }
    ], { duration: 320, easing: 'ease', fill: 'forwards' });

    anim(finalEl, [
      { opacity: 1 },
      { opacity: 0 }
    ], { duration: 340, easing: 'ease', fill: 'forwards' });

    await wait(360);

    // limpa tudo
    clearAnims(finalEl);
    clearAnims(finalInner);
    clearAnims(glow);
    clearAnims(hint);
    letters.forEach(clearAnims);

    finalEl.style.opacity = '0';
    finalEl.style.clipPath = 'circle(0px at 50% 50%)';
    finalInner.style.transform = '';
    glow.style.opacity = '0';
    hint.style.opacity = '0';
    letters.forEach(l => { l.style.opacity = '0'; });

    // devolve o convite
    intro.style.opacity = '0';
    intro.style.transformOrigin = '50% 50%';
    clearAnims(intro);
    anim(intro, [
      { opacity: 0, transform: 'scale(1.1)' },
      { opacity: 1, transform: 'scale(1)' }
    ], { duration: 460, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });

    live.textContent = '';
    await wait(160);
    state = 'idle';
  }

  /* ---------- replay ---------- */
  async function replay(x, y) {
    if (state !== 'done') return;
    await reset();
    play(x, y);
  }

  /* ---------- cliques ---------- */
  function pointFrom(e) {
    const keyboard = e.detail === 0 || (!e.clientX && !e.clientY);
    if (keyboard) {
      return {
        x: (scene.clientWidth  || innerWidth)  / 2,
        y: (scene.clientHeight || innerHeight) / 2
      };
    }
    return { x: e.clientX, y: e.clientY };
  }

  scene.addEventListener('click', e => {
    if (state === 'idle') {
      const { x, y } = pointFrom(e);
      play(x, y);
    } else if (state === 'done') {
      const { x, y } = pointFrom(e);
      replay(x, y);
    }
  });

  scene.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state === 'done') reset();
  });
})();
</script>
</body>
</html>
